<!DOCTYPE html>
<html>
<head>
    <title>Four Box Animation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        /* Main area */
        .container {
            position: relative;

            width: 800px;
            height: 400px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* 
           CENTER MESSAGE
          */

        .message {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            opacity: 0;

            transition: opacity 0.8s ease;

            z-index: 1;

            pointer-events: none;
        }

        .message h2 {
            margin: 0 0 10px;
        }


        /*
           FOUR BOXES
                        */

        .box-container {
            position: relative;

            width: 200px;
            height: 200px;

            display: grid;

            grid-template-columns: 100px 100px;
            grid-template-rows: 100px 100px;

            z-index: 2;

            cursor: pointer;
        }


        .box {
            width: 100px;
            height: 100px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;

            transition: transform 1s ease;
        }


        /* Colors */

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .yellow {
            background-color: yellow;
        }

        .blue {
            background-color: blue;
        }


        /*
           MOUSE GOES NEAR BOXES
            */

        .box-container:hover .red {
            transform: translate(-150px, -80px) rotate(90deg);
        }

        .box-container:hover .green {
            transform: translate(150px, -80px) rotate(90deg);
        }

        .box-container:hover .yellow {
            transform: translate(-150px, 80px) rotate(90deg);
        }

        .box-container:hover .blue {
            transform: translate(150px, 80px) rotate(90deg);
        }


        /* Show message */

        .box-container:hover ~ .message {
            opacity: 1;
        }

    </style>
</head>


<body>

    <div class="container">

        <!-- Four boxes -->

        <div class="box-container">

            <div class="box red">RED</div>

            <div class="box green">GREEN</div>

            <div class="box yellow">YELLOW</div>

            <div class="box blue">BLUE</div>

        </div>


        <!-- Hidden message -->

        <div class="message">

            <h2>Welcome!</h2>

          

        </div>

    </div>

</body>
</html>
